services:
  postgres:
    image: postgres:16-alpine
    container_name: ctpsms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ctpsms
    ports:
      - "5432:5432"
    volumes:
      - ctpsms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ctpsms"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ctpsms-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ctpsms?schema=public
      JWT_SECRET: ctpsms-super-secret-jwt-key-change-in-production
      DEFAULT_API_KEY: system-user-api-key
      CORS_ORIGIN: "*"
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ctpsms-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  ctpsms_postgres_data:
