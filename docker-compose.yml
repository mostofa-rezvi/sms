services:
  mysql:
    image: mysql:8.0
    container_name: ctpsms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ctpsms
    ports:
      - "3307:3306"
    volumes:
      - ctpsms_mysql_data:/var/lib/mysql

volumes:
  ctpsms_mysql_data:

